<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A responsive and feature-rich To-Do List app to manage your daily tasks efficiently." />
  <title>My To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="do.css" />
</head>
<body>

  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <h1>My To-Do List</h1>
      <p class="subtitle">Created by Pruthvi</p>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-num" id="totalCount">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="pendingCount">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="doneCount">0</span>
        <span class="stat-label">Done</span>
      </div>
    </div>

    <!-- Input Section -->
    <section class="input-section" aria-label="Add a new task">
      <div class="input-row">
        <input
          type="text"
          id="taskInput"
          placeholder="Add a new task…"
          autocomplete="off"
          aria-label="Task input"
          maxlength="120"
        />
        <button id="addTaskBtn" aria-label="Add task">
          <span class="btn-icon">+</span> Add
        </button>
      </div>
    </section>

    <!-- Filter & Controls -->
    <div class="controls-row">
      <div class="filter-btns" role="group" aria-label="Filter tasks">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button id="deleteAllBtn" aria-label="Delete all tasks">🗑 Clear All</button>
    </div>

    <!-- Task List -->
    <ul id="taskList" aria-label="Task list" aria-live="polite"></ul>

   
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle">Edit Task</h2>
      <input type="text" id="editInput" placeholder="Update your task…" maxlength="120" />
      <div class="modal-actions">
        <button id="cancelEditBtn" class="btn-cancel">Cancel</button>
        <button id="saveEditBtn" class="btn-save">Save</button>
      </div>
    </div>
  </div>

  <script src="list.js"></script>
</body>
</html>
